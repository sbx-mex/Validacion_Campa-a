name: Calidad y estabilidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validar contrato y reporte PDF
        run: python tests/validate_project.py

      - name: Probar cálculo de puntuación
        run: python -m unittest tests/test_scoring.py

      - name: Revisar JavaScript
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Construir y verificar paquete
        run: |
          python scripts/build_release.py --output /tmp/Validacion_Campana_Fall26_GitHub.zip
          python scripts/verify_integrity.py
          unzip -t /tmp/Validacion_Campana_Fall26_GitHub.zip
